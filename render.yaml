services:
  - type: web
    name: spygame
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
